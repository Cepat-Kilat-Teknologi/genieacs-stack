# =============================================================================
# CI Workflow: Multi-architecture Docker Build & Push
# =============================================================================
# Purpose: Build linux/amd64 and linux/arm64 Docker images for GenieACS,
#          push them to both Docker Hub and GitHub Container Registry (GHCR),
#          then sign the images and generate provenance attestations.
#
# Why dual registries?  Docker Hub gives broad public reach; GHCR integrates
#                        tightly with GitHub permissions and keeps everything
#                        in one platform for contributors.
#
# Security: Images are signed with Sigstore cosign (keyless / OIDC) and
#           include SBOM + provenance attestations so consumers can verify
#           the build was not tampered with (supply-chain transparency).
# =============================================================================

name: ci

on:
  push:
    branches: [ "main" ]
    # No trigger-level path filters: the `changes` job decides. Tags always
    # count as code changes so every release gets published.
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
    # Change filtering is done by the `changes` job (not here) so that the
    # required `build` check still reports (as Skipped) on docs-only PRs.
  workflow_dispatch:

env:
  # Pinned application version used as a Docker tag (updated by release.yml).
  IMAGE_VERSION: '1.2.16'
  # Docker Hub
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE: cepatkilatteknologi/genieacs
  # GitHub Container Registry (OCI registries require lowercase repository names)
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/cepat-kilat-teknologi/genieacs

# Cancel superseded PR runs only; main, tag and scheduled runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ========================
  # changes: classify the change set as code / non-code
  # Runs on PRs and pushes. Non-code-only changes (docs, templates, repo
  # metadata) report the required checks as Skipped instead of running them.
  # Tags, new branches, manual/scheduled runs and any classification
  # failure count as code changes (fail safe).
  # ========================
  changes:
    name: changes (build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          out() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "code=$1 ($2)"; exit 0; }
          case "$EVENT" in
            pull_request) RANGE="$PR_BASE...$PR_HEAD" ;;
            push)
              [[ "$REF" == refs/tags/* ]] && out true "tag"
              [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] && out true "new branch"
              RANGE="$BEFORE..$SHA" ;;
            *) out true "event $EVENT" ;;
          esac
          if ! files=$(git diff --no-renames --name-only "$RANGE"); then out true "git diff failed"; fi
          [ -z "$files" ] && out true "no files listed"
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*|LICENSE|LICENSE.*|.gitignore|.gitattributes|.editorconfig|.claude/*|CODEOWNERS|\
              .github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|\
              .github/PULL_REQUEST_TEMPLATE/*|.github/dependabot.yml|.github/actionlint.yaml|\
              .gitleaks.toml|.gitleaksignore|.github/workflows/gitleaks.yml|.env.example|.env.*.example|*.http) ;;
              *) out true "code file: $f" ;;
            esac
          done <<< "$files"
          out false "non-code only"

  # ========================
  # build: multi-arch Docker build that never pushes (validates the
  # Dockerfile on PRs; on main/tags it runs before `image`)
  # ========================
  build:
    name: build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================
  # image: Build, push, attest and sign the Docker image (main/tags only,
  # and only when code changed and `build` succeeded)
  # ========================
  image:
    name: image
    needs: [changes, build]
    if: >-
      ${{ !cancelled()
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      && needs.changes.outputs.code == 'true'
      && needs.build.result == 'success' }}
    # TODO: For faster arm64 builds, use matrix strategy:
    # strategy:
    #   matrix:
    #     include:
    #       - runner: ubuntu-latest
    #         platform: linux/amd64
    #       - runner: ubuntu-24.04-arm
    #         platform: linux/arm64
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      packages: write       # Required to push images to GHCR
      id-token: write       # Required for cosign keyless signing via OIDC
      attestations: write   # Required for build-provenance attestation uploads

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # QEMU lets Docker Buildx emulate arm64 on an amd64 runner so we can
      # produce multi-architecture images from a single job.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Buildx is the extended Docker builder that supports multi-platform
      # builds, advanced caching, and exporting provenance/SBOM metadata.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cosign provides keyless (OIDC-based) image signing through Sigstore.
      # Skipped on PRs because fork PRs lack the id-token permission needed
      # for keyless signing, and we do not want to sign unmerged code anyway.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # ---------------------------------------------------------------
      # Registry logins are conditional on non-PR events because:
      #   1. Fork-based PRs do not have access to repository secrets.
      #   2. We only push images after code lands on main or is tagged.
      # ---------------------------------------------------------------

      # Login to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # Tag strategy (metadata-action):
      #   - raw IMAGE_VERSION : deterministic tag matching the app version
      #   - latest            : convenience tag, only on the default branch
      #   - semver {{version}}: full semver from git tag  (e.g. 1.2.16)
      #   - semver {{major}}.{{minor}}: allows "1.2" floating tag
      #   - sha               : immutable commit-SHA tag for traceability
      # ---------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      # ---------------------------------------------------------------
      # Build & push the multi-arch image.
      #
      # Cache strategy uses BOTH GitHub Actions cache (GHA) and a registry
      # cache stored as a special tag on GHCR:
      #   - GHA cache  : fast for same-branch rebuilds within the same repo.
      #   - Registry cache: survives across PRs and forks, giving cross-PR
      #     cache hits and avoiding cold builds after cache eviction.
      #
      # provenance & sbom are enabled to embed supply-chain metadata
      # directly into the image manifest, so consumers can audit the build
      # without trusting external attestation stores.
      # ---------------------------------------------------------------
      - name: Build & Push
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # On PRs we only build (no push) to validate the Dockerfile.
          push: ${{ github.event_name != 'pull_request' }}
          provenance: true    # Embeds SLSA provenance for supply-chain security
          sbom: true          # Embeds a Software Bill of Materials (SBOM)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache is always available.  The GHCR registry cache requires
          # authentication, which is only configured on non-PR events (fork PRs
          # lack access to repository secrets).  Omitting it on PRs avoids the
          # "401 Unauthorized" error from ghcr.io/token.
          cache-from: |
            type=gha
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache', env.GHCR_IMAGE) || '' }}
          cache-to: |
            type=gha,mode=max
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.GHCR_IMAGE) || '' }}

      # ---------------------------------------------------------------
      # Attestations create a signed, tamper-evident record that links
      # the image digest to this specific GitHub Actions build.  One
      # attestation per registry so each can be independently verified.
      # ---------------------------------------------------------------

      # Generate artifact attestation for Docker Hub
      - name: Generate attestation (Docker Hub)
        uses: actions/attest-build-provenance@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-name: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Generate artifact attestation for GHCR
      - name: Generate attestation (GHCR)
        uses: actions/attest-build-provenance@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Cosign keyless signing uses GitHub's OIDC token to prove the image
      # was built by this workflow in this repository, without managing any
      # long-lived signing keys.  Verifiers check the Sigstore transparency
      # log instead.
      - name: Sign images with cosign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}@${DIGEST}"
          cosign sign --yes "${{ env.GHCR_IMAGE }}@${DIGEST}"

      # Write a human-readable summary to the GitHub Actions job page.
      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | \`${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`cepat-kilat-teknologi/genieacs:${{ env.IMAGE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
