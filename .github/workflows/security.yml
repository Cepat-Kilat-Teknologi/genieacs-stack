# =============================================================================
# Security Scan Workflow
# =============================================================================
# Purpose: Continuously scan the GenieACS Docker image and repository
#          configuration for known vulnerabilities (CVEs) and misconfigurations.
#
# Why Trivy?
#   - Comprehensive CVE database (NVD, GitHub Advisories, distro-specific).
#   - Native SARIF output integrates with GitHub's Security tab so findings
#     appear alongside code scanning alerts.
#   - Supports both container image scanning AND IaC/config file scanning
#     in a single tool.
#
# Why a scheduled run (cron)?
#   New CVEs are disclosed constantly.  The weekly Monday scan catches
#   vulnerabilities that were published AFTER the last image build, even
#   if no code has changed.  Push/PR triggers alone would miss these.
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
    # Only re-scan on push when files that affect the image change.
    paths:
      - 'Dockerfile'
      - 'config/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
  # Weekly scan every Monday at 06:00 UTC to catch newly disclosed CVEs
  # against the existing image, even when no code has changed.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Cancel superseded PR runs only; main, tag and scheduled runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ========================
  # changes: classify the change set as code / non-code
  # Runs on PRs and pushes. Non-code-only changes (docs, templates, repo
  # metadata) report the required checks as Skipped instead of running them.
  # Tags, new branches, manual/scheduled runs and any classification
  # failure count as code changes (fail safe).
  # ========================
  changes:
    name: changes (vuln)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          out() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "code=$1 ($2)"; exit 0; }
          case "$EVENT" in
            pull_request) RANGE="$PR_BASE...$PR_HEAD" ;;
            push)
              [[ "$REF" == refs/tags/* ]] && out true "tag"
              [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] && out true "new branch"
              RANGE="$BEFORE..$SHA" ;;
            *) out true "event $EVENT" ;;
          esac
          if ! files=$(git diff --no-renames --name-only "$RANGE"); then out true "git diff failed"; fi
          [ -z "$files" ] && out true "no files listed"
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*|LICENSE|LICENSE.*|.gitignore|.gitattributes|.editorconfig|.claude/*|CODEOWNERS|\
              .github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|\
              .github/PULL_REQUEST_TEMPLATE/*|.github/dependabot.yml|.github/actionlint.yaml|\
              .gitleaks.toml|.gitleaksignore|.github/workflows/gitleaks.yml|.env.example|.env.*.example|*.http) ;;
              *) out true "code file: $f" ;;
            esac
          done <<< "$files"
          out false "non-code only"

  # vuln: Trivy image + config scan
  vuln:
    name: vuln
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    permissions:
      contents: read
      # Required to upload SARIF results to the GitHub Security tab.
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Build a local image specifically for scanning.  This ensures we
      # test the exact layers and packages that would ship in production.
      - name: Build image for scanning
        run: docker build -t genieacs-scan:latest .

      # ---------------------------------------------------------------
      # Image scan: inspects OS packages and application dependencies
      # inside the built container image for known CVEs.
      #
      # - SARIF format is used so results integrate with GitHub Code
      #   Scanning alerts (visible under the Security tab).
      # - exit-code 1 fails the workflow on CRITICAL or HIGH findings
      #   to enforce a security gate before merging.
      # ---------------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'genieacs-scan:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # Upload even when the scan step fails (if: always) so that
      # developers can review the full findings in the Security tab
      # regardless of whether the workflow passed or not.
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # ---------------------------------------------------------------
      # Config scan: a SEPARATE pass that examines Dockerfiles, YAML,
      # and other IaC files in the repository for misconfigurations
      # (e.g., running as root, exposed secrets, insecure defaults).
      #
      # This is different from the image scan above:
      #   - Image scan  -> checks installed packages for CVEs.
      #   - Config scan -> checks source files for bad practices.
      # ---------------------------------------------------------------
      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
