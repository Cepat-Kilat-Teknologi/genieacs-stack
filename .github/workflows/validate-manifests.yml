# =============================================================================
# Kubernetes Manifest Validation Workflow
# =============================================================================
# Purpose: Validate all Kubernetes manifests (raw YAML and Helm-rendered
#          templates) against the official Kubernetes OpenAPI schema to catch
#          structural errors, typos, and deprecated API usage BEFORE they
#          reach a cluster.
#
# Why kubeconform?
#   - Validates resources against the real Kubernetes OpenAPI spec, not just
#     generic YAML syntax.  This catches issues like misspelled fields,
#     wrong API versions, and invalid value types that plain YAML linting
#     would miss.
#   - Much faster than running a full "kubectl apply --dry-run=server".
#
# Why validate BOTH raw YAML and Helm-rendered output?
#   - Raw YAML manifests (used with kubectl/kustomize) may have different
#     content than the Helm templates.
#   - Helm templates can introduce errors through Go template logic that
#     only surface after rendering.  Validating the rendered output ensures
#     the final manifests that would be applied to a cluster are correct.
# =============================================================================

name: Validate Manifests

on:
  push:
    branches: [main]
  # No trigger-level path filters: the `changes` job decides, so the
  # required `lint` check still reports (as Skipped) on docs-only changes.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs only; main, tag and scheduled runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ========================
  # changes: classify the change set as code / non-code
  # Runs on PRs and pushes. Non-code-only changes (docs, templates, repo
  # metadata) report the required checks as Skipped instead of running them.
  # Tags, new branches, manual/scheduled runs and any classification
  # failure count as code changes (fail safe).
  # ========================
  changes:
    name: changes (lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          out() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "code=$1 ($2)"; exit 0; }
          case "$EVENT" in
            pull_request) RANGE="$PR_BASE...$PR_HEAD" ;;
            push)
              [[ "$REF" == refs/tags/* ]] && out true "tag"
              [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] && out true "new branch"
              RANGE="$BEFORE..$SHA" ;;
            *) out true "event $EVENT" ;;
          esac
          if ! files=$(git diff --no-renames --name-only "$RANGE"); then out true "git diff failed"; fi
          [ -z "$files" ] && out true "no files listed"
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*|LICENSE|LICENSE.*|.gitignore|.gitattributes|.editorconfig|.claude/*|CODEOWNERS|\
              .github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|\
              .github/PULL_REQUEST_TEMPLATE/*|.github/dependabot.yml|.github/actionlint.yaml|\
              .gitleaks.toml|.gitleaksignore|.github/workflows/gitleaks.yml|.env.example|.env.*.example|*.http) ;;
              *) out true "code file: $f" ;;
            esac
          done <<< "$files"
          out false "non-code only"

  # lint: kubeconform validation of raw manifests and rendered Helm charts
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.7.0"
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform-linux-amd64.tar.gz
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/CHECKSUMS" -o CHECKSUMS
          grep "kubeconform-linux-amd64.tar.gz" CHECKSUMS | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
          rm -f kubeconform-linux-amd64.tar.gz CHECKSUMS

      # ---------------------------------------------------------------
      # Raw YAML validation: these manifests are used directly with
      # kubectl apply or Kustomize.  Validating them catches issues in
      # hand-written YAML before it ever reaches a cluster.
      #
      # -strict        : reject unknown fields (catches typos)
      # -kubernetes-version : pin the schema version for reproducibility
      # -skip CRD      : CRDs define their own schema; kubeconform
      #                   cannot validate them against the core API spec
      # ---------------------------------------------------------------

      - name: Validate default Kustomize manifests
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.29.0 \
            -skip CustomResourceDefinition \
            -ignore-filename-pattern 'kustomization.yaml' \
            examples/default/kubernetes/*.yaml

      - name: Validate nbi-auth Kustomize manifests
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.29.0 \
            -skip CustomResourceDefinition \
            -ignore-filename-pattern 'kustomization.yaml' \
            examples/nbi-auth/kubernetes/*.yaml

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # ---------------------------------------------------------------
      # Helm template validation: render the charts with default values
      # and pipe the output through kubeconform.  This catches errors
      # introduced by Go template logic (conditionals, loops, helpers)
      # that only appear in the final rendered YAML.
      # ---------------------------------------------------------------

      - name: Validate Helm templates - default
        run: |
          helm template test examples/default/helm/genieacs | \
            kubeconform -strict -summary -kubernetes-version 1.29.0

      - name: Validate Helm templates - nbi-auth
        run: |
          helm template test examples/nbi-auth/helm/genieacs | \
            kubeconform -strict -summary -kubernetes-version 1.29.0
